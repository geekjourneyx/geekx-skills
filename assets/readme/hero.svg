<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="400" viewBox="0 0 1200 400"
     role="img" aria-labelledby="title desc">
  <title id="title">GeekX Skills</title>
  <desc id="desc">把工程架构中的判断、约束与取舍，沉淀为可执行的智能体技能。</desc>

  <defs>
    <pattern id="paper-grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#D9D5CA" stroke-width="0.7" opacity="0.42"/>
    </pattern>
    <pattern id="hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#A7ADA5" stroke-width="2" opacity="0.35"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="18" fill="#F3F0E8"/>
  <rect x="1" y="1" width="1198" height="398" rx="17" fill="none" stroke="#C8C3B8" stroke-width="2"/>
  <rect x="24" y="24" width="1152" height="352" fill="url(#paper-grid)"/>

  <g id="registration" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="12" font-weight="700" fill="#66716A" letter-spacing="1.8">
    <text x="54" y="58">ENGINEERING ARCHITECTURE / EXECUTABLE SKILLS</text>
    <text x="1046" y="58">GX·001</text>
  </g>

  <g id="title-block" transform="translate(54 88)">
    <text x="0" y="64"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="72" font-weight="820" fill="#171815" letter-spacing="-2.6">GeekX Skills</text>

    <rect x="2" y="92" width="56" height="5" rx="2.5" fill="#D65432"/>
    <line x1="70" y1="94.5" x2="374" y2="94.5" stroke="#3157A8" stroke-width="1.5"/>

    <text x="0" y="137"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="25" font-weight="680" fill="#2C302C">把工程架构中的判断、约束与取舍，</text>
    <text x="0" y="174"
          font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif"
          font-size="25" font-weight="680" fill="#2C302C">沉淀为可执行的智能体技能。</text>

    <g transform="translate(0 218)"
       font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
       font-size="12" font-weight="750" letter-spacing="1.1">
      <text x="0" y="0" fill="#3157A8">CONSTRAINTS</text>
      <circle cx="105" cy="-4" r="2.5" fill="#D65432"/>
      <text x="120" y="0" fill="#66716A">TRADE-OFFS</text>
      <circle cx="229" cy="-4" r="2.5" fill="#D65432"/>
      <text x="244" y="0" fill="#66716A">DECISIONS</text>
      <circle cx="333" cy="-4" r="2.5" fill="#D65432"/>
      <text x="348" y="0" fill="#66716A">EVALS</text>
    </g>
  </g>

  <g id="architecture-notes" transform="translate(592 79)">
    <rect x="0" y="0" width="536" height="258" rx="8" fill="#ECE9DF" stroke="#343A35" stroke-width="1.5"/>
    <path d="M372 0H528a8 8 0 0 1 8 8v242a8 8 0 0 1-8 8H372z" fill="#E4E8E2"/>
    <line x1="372" y1="0" x2="372" y2="258" stroke="#343A35" stroke-width="1.5"/>

    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="22" y="28" font-size="11" font-weight="700" fill="#66716A" letter-spacing="1.4">ARCHITECTURE FIELD NOTE</text>
      <text x="457" y="28" font-size="11" font-weight="700" fill="#3157A8" letter-spacing="1.2">REV. 04</text>
    </g>

    <g id="constraint-boundary" transform="translate(22 48)">
      <rect x="0" y="0" width="128" height="72" fill="url(#hatch)" stroke="#343A35" stroke-width="1.4"/>
      <rect x="18" y="17" width="92" height="38" fill="#F3F0E8" stroke="#3157A8" stroke-width="1.5"/>
      <text x="64" y="40" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="11" font-weight="800" fill="#3157A8" letter-spacing="1.3">BOUNDARY</text>
      <line x1="-8" y1="0" x2="-8" y2="72" stroke="#D65432" stroke-width="1.4"/>
      <path d="M-13 5L-8 0l5 5M-13 67l5 5 5-5" fill="none" stroke="#D65432" stroke-width="1.4"/>
    </g>

    <g id="decision-path" transform="translate(180 53)">
      <circle cx="8" cy="31" r="8" fill="#3157A8"/>
      <path d="M16 31H62M62 31V8M62 31V55M62 8H105M62 55H105" fill="none" stroke="#343A35" stroke-width="2"/>
      <circle cx="112" cy="8" r="7" fill="#F3F0E8" stroke="#343A35" stroke-width="1.5"/>
      <circle cx="112" cy="55" r="7" fill="#D65432"/>
      <path d="M109 55l3 3 6-7" fill="none" stroke="#F3F0E8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="0" y="81"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" font-weight="750" fill="#66716A" letter-spacing="1.1">DECISION PATH</text>
    </g>

    <g id="revision-notes" transform="translate(394 51)"
       font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
      <text x="0" y="0" font-size="10" font-weight="800" fill="#D65432" letter-spacing="1.1">CHECKPOINTS</text>
      <g transform="translate(0 19)" font-size="10" font-weight="700" fill="#4E5750">
        <circle cx="5" cy="-3" r="4" fill="none" stroke="#3157A8" stroke-width="1.4"/>
        <text x="18" y="0">evidence</text>
        <circle cx="5" cy="19" r="4" fill="#3157A8"/>
        <text x="18" y="22">constraints</text>
        <circle cx="5" cy="41" r="4" fill="none" stroke="#D65432" stroke-width="1.4"/>
        <text x="18" y="44">trade-offs</text>
        <circle cx="5" cy="63" r="4" fill="#D65432"/>
        <text x="18" y="66">decision</text>
      </g>
    </g>

    <g id="skill-sequence" transform="translate(22 153)">
      <line x1="0" y1="0" x2="328" y2="0" stroke="#343A35" stroke-width="1.4"/>
      <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10" font-weight="760">
        <g transform="translate(0 18)">
          <rect width="76" height="54" rx="3" fill="#F3F0E8" stroke="#343A35" stroke-width="1.2"/>
          <text x="10" y="21" fill="#3157A8">JUDGMENT</text>
          <text x="10" y="39" fill="#66716A">skill / 01</text>
        </g>
        <g transform="translate(88 18)">
          <rect width="76" height="54" rx="3" fill="#F3F0E8" stroke="#343A35" stroke-width="1.2"/>
          <text x="10" y="21" fill="#3157A8">BOUNDARY</text>
          <text x="10" y="39" fill="#66716A">skill / 02</text>
        </g>
        <g transform="translate(176 18)">
          <rect width="76" height="54" rx="3" fill="#F3F0E8" stroke="#343A35" stroke-width="1.2"/>
          <text x="10" y="21" fill="#3157A8">DECISION</text>
          <text x="10" y="39" fill="#66716A">skill / 03</text>
        </g>
        <g transform="translate(264 18)">
          <rect width="64" height="54" rx="3" fill="none" stroke="#D65432" stroke-width="1.4" stroke-dasharray="5 4"/>
          <text x="32" y="34" text-anchor="middle" font-size="22" fill="#D65432">+</text>
        </g>
      </g>
    </g>

    <g id="evaluation-stamp" transform="translate(399 163)">
      <circle cx="49" cy="39" r="39" fill="none" stroke="#D65432" stroke-width="2"/>
      <circle cx="49" cy="39" r="31" fill="none" stroke="#D65432" stroke-width="1" stroke-dasharray="3 3"/>
      <text x="49" y="34" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="10" font-weight="850" fill="#D65432" letter-spacing="1.5">EVAL</text>
      <text x="49" y="50" text-anchor="middle"
            font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
            font-size="12" font-weight="900" fill="#D65432" letter-spacing="1.2">VERIFIED</text>
    </g>
  </g>

  <g id="footer-metadata" transform="translate(54 358)"
     font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
     font-size="11" font-weight="700" letter-spacing="1.3">
    <text x="0" y="0" fill="#66716A">FOCUSED · COMPOSABLE · RUNTIME-NEUTRAL</text>
    <text x="968" y="0" fill="#3157A8">geekx-*</text>
  </g>
</svg>
